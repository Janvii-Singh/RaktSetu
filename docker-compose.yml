version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: raktsetu-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: raktsetu-ml
    ports:
      - "5001:5001"
    environment:
      - ML_PORT=5001
      - FLASK_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  server:
    build: ./server
    container_name: raktsetu-server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/raktsetu
      - JWT_SECRET=${JWT_SECRET:-raktsetu_jwt_secret_2024}
      - JWT_EXPIRE=7d
      - ML_SERVICE_URL=http://ml-service:5001
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
        - VITE_SOCKET_URL=
        - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    container_name: raktsetu-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
