version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: raktsetu-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - raktsetu-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: raktsetu-ml
    ports:
      - "5001:5001"
    environment:
      - ML_PORT=5001
      - FLASK_DEBUG=false
    restart: unless-stopped
    networks:
      - raktsetu-network
    volumes:
      - ml-models:/app/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  server:
    build: ./server
    container_name: raktsetu-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/raktsetu
      - JWT_SECRET=${JWT_SECRET:-raktsetu_jwt_secret_2024_change_me}
      - JWT_EXPIRE=7d
      - ML_SERVICE_URL=http://ml-service:5001
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - raktsetu-network
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api  # FIXED: Use relative path, not localhost
        - VITE_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    container_name: raktsetu-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - raktsetu-network

networks:
  raktsetu-network:
    driver: bridge

volumes:
  mongo-data:
  ml-models: